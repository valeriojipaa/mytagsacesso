<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes · MY TAGS</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#241447;font:16px system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:30px;margin-bottom:6px}p{line-height:1.5;color:#615875}section,dialog{background:#fff;border:1px solid #e3dfee;border-radius:18px;padding:24px;margin-top:24px}input{font:inherit;padding:12px;border:1px solid #c7bfd8;border-radius:9px;max-width:100%;width:100%;margin:8px 0 16px}button,a{font:inherit}button{border:0;border-radius:9px;padding:12px 16px;background:#642bd1;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#ebe6f5;color:#38244e}label{display:block}form{max-width:500px}.row{padding:18px 0;border-bottom:1px solid #e7e2ed;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.row strong{overflow-wrap:anywhere}.row small{display:block;margin-top:6px;color:#615875}.actions{display:flex;gap:8px;flex-wrap:wrap}#status{padding:12px 0;min-height:40px}dialog{max-width:480px;margin:auto}dialog::backdrop{background:#21103580}input[type=checkbox]{width:auto}a{color:#642bd1}[hidden]{display:none!important}
</style></head><body><main><header><div><h1>Seus clientes</h1><p>Confira o Pix e libere o acesso por 30 dias.</p></div><button id="logout" class="secondary" hidden>Sair</button></header>
<section id="signin"><h2>Entrar como administrador</h2><p>Use a conta autorizada da MY TAGS.</p><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar no painel</button></form><p><a href="/">Voltar à página de acesso ou recuperar senha</a></p></section>
<p id="status" role="status" aria-live="polite"></p><section id="panel" hidden><form id="search"><label>Buscar cliente pelo e-mail<input id="query" type="search" placeholder="E-mail do cliente" maxlength="200"></label><button>Buscar</button></form><p>Até 50 cadastros recentes por busca. A renovação acrescenta 30 dias ao prazo ainda válido.</p><div id="clients"></div></section>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmClient"></p><p id="confirmInfo"></p><label id="paidLabel"><input id="paid" type="checkbox">Conferi o recebimento de R$ 39,99 no banco.</label><p id="actionStatus" role="status"></p><div class="actions"><button id="apply" disabled>Confirmar</button><button id="cancel" class="secondary">Cancelar</button></div></dialog>
<script type="module" src="admin.js"></script></main></body></html>
